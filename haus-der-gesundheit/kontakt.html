<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Haus der Gesundheit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <section class="page-hero">
            <div>
                <p class="eyebrow">Wir sind für Sie da</p>
                <h1>Kontakt <em>aufnehmen</em></h1>
            </div>
        </section>

        <section class="page-content">
            <div class="content-grid">
                <div>
                    <p class="eyebrow">Terminvereinbarung</p>
                    <h2>Ihre Fragen sind willkommen.</h2>
                    <p>
                        Schreiben Sie uns gerne eine Nachricht. Wir melden uns
                        schnellstmöglich bei Ihnen zurück.
                    </p>

                    <p>
                        Musterstraße 1<br>
                        12345 Musterstadt<br><br>
                        Telefon: 0123 456789<br>
                        E-Mail: hallo@haus-der-gesundheit.de
                    </p>
                </div>

                <form class="contact-form" action="#" method="post">
                    <label for="name">
                        Name
                        <input id="name" name="name" type="text" required>
                    </label>

                    <label for="email">
                        E-Mail-Adresse
                        <input id="email" name="email" type="email" required>
                    </label>

                    <label for="message">
                        Nachricht
                        <textarea id="message" name="message" required></textarea>
                    </label>

                    <button class="button button-primary" type="submit">
                        Nachricht senden
                    </button>
                </form>
            </div>
        </section>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="js/partials.js"></script>
</body>
</html>
